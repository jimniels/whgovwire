name: Save White House Wire

on:
  schedule:
    - cron: "8 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Download webpage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshots
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          temporary=$(mktemp)
          trap 'rm -f "$temporary"' EXIT

          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --retry 3 --retry-delay 10 --retry-max-time 180 \
            --output "$temporary" \
            https://www.whitehouse.gov/wire/

          test -s "$temporary"
          mv "$temporary" "snapshots/whgovwire_html_${timestamp}.html"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git commit -m "Save White House Wire snapshot"
          git push